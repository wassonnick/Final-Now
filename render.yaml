services:
  # Frontend (React + Vite)
  - type: web
    name: societyflats-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: /api
      - key: VITE_GA_MEASUREMENT_ID
        value: G-FC4045CRJS
      # Analytics is off until there is enough traffic for it to say anything. Absent or
      # anything other than "true" means no GA script and no consent banner — the two are
      # governed together so notice and collection can never disagree. Set to "true" in the
      # dashboard (Environment) and redeploy to switch both back on.
      - key: VITE_ANALYTICS_ENABLED
        value: "false"
    routes:
      # WARNING: this block does not serve production traffic.
      #
      # Final-Now-1 was created by hand rather than from this blueprint, so Render ignores
      # the routes here. Proven the hard way: 263 rules were added and deployed green, and
      # /near/aerocity still served the SPA fallback while /near/aerocity/index.html served
      # its real shell. The rules that actually run are in the dashboard under
      # Final-Now-1 -> Redirects/Rewrites, ending in a /* -> /index.html catch-all that
      # swallows anything above it without a rule.
      #
      # A rule working in production does NOT prove this file is applied — the same rule is
      # usually in the dashboard too. Adding a new PAGE TYPE means adding a wildcard rule in
      # the dashboard, above the catch-all, or the whole type serves noindex homepage copies.
      #
      # Kept generated and in sync regardless: it is the spec validate-seo.mjs checks the
      # sitemap against, and what would apply if these services were ever recreated from it.
      # Keep browser API traffic on the SocietyFlats origin. This avoids login,
      # lead and account flows depending on a separate cross-origin connection
      # to Render while preserving the Laravel API as the source of truth.
      - type: rewrite
        source: /api/*
        destination: https://final-now.onrender.com/api/*

      # Live registry sitemap, proxied onto the site's own domain. GSC only accepts
      # sitemap URLs inside the verified property (sc-domain:societyflats.com), so the
      # backend URL can't be submitted directly — this rewrite serves it same-host.
      - type: rewrite
        source: /sitemap-live.xml
        destination: https://final-now.onrender.com/api/seo/sitemap.xml

      # BEGIN generated shell routes — written by scripts/sync-render-routes.mjs
      # 291 prerendered pages. Do not edit by hand — rebuild instead.
      - type: rewrite
        source: /404
        destination: /404/index.html
      - type: rewrite
        source: /ai-advisor
        destination: /ai-advisor/index.html

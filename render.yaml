        destination: /trust/index.html
      # END generated shell routes

      # Prerendered detail pages. These MUST come before the catch-all below: without
      # them every society, property, compare and RWA URL fell through to /index.html
      # and served the homepage's title, description and canonical. The build generates
      # ~990 shells; only the routes listed explicitly above were ever reaching a
      # visitor, so the money pages were telling search engines they were duplicates of
      # the homepage.
      - type: rewrite
        source: /society/*
        destination: /society/*/index.html
      - type: rewrite
        source: /property/*
        destination: /property/*/index.html
      - type: rewrite
        source: /compare/*
        destination: /compare/*/index.html
      - type: rewrite
        source: /compare
        destination: /compare/index.html
      - type: rewrite
        source: /rwa/*
        destination: /rwa/*/index.html
      - type: rewrite
        source: /ncr/*
        destination: /ncr/*/index.html

      # SPA fallback for admin, search, account and other client-only React routes.
      - type: rewrite
        source: /*
        destination: /index.html

  # Backend (Laravel)
  - type: web
    name: societyflats-api
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: APP_NAME
        value: SocietyFlats
      - key: APP_ENV
        value: production
      - key: APP_KEY
        generateValue: true
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://final-now.onrender.com
      - key: FRONTEND_URL
        value: https://www.societyflats.com
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: societyflats-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: societyflats-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: societyflats-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: societyflats-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: societyflats-db
          property: password
      - key: CACHE_DRIVER
        value: file
      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: LOG_CHANNEL
        value: stderr
      - key: MEILISEARCH_HOST
        value: ""
      - key: MEILISEARCH_KEY
        value: ""
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: AI_IMPORT_PROVIDER
        value: gemini
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5
      - key: GOOGLE_SEARCH_CONSOLE_SITE_URL
        value: https://www.societyflats.com
      - key: GOOGLE_SEARCH_CONSOLE_ACCESS_TOKEN
        sync: false
      - key: GOOGLE_SEARCH_CONSOLE_CLIENT_ID
        sync: false
      - key: GOOGLE_SEARCH_CONSOLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_SEARCH_CONSOLE_REFRESH_TOKEN
        sync: false
      - key: META_CONNECT_SCOPES
        value: public_profile,pages_show_list,pages_read_engagement,business_management
      - key: META_PUBLISH_SCOPES
        value: pages_manage_posts,pages_manage_engagement,instagram_basic,instagram_content_publish
      - key: UPLOADS_DISK
        value: r2
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_PUBLIC_URL
        sync: false

  # Scheduler worker. Queue delivery is synchronous; this process runs due alert matching.
  - type: worker
    name: societyflats-worker
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    startCommand: php artisan schedule:work
    envVars:
      - key: APP_NAME
        value: SocietyFlats
      - key: APP_ENV
        value: production
      - key: APP_KEY
        fromService:
          name: societyflats-api
          type: web
          envVarKey: APP_KEY
      - key: FRONTEND_URL
        value: https://www.societyflats.com
      - key: GOOGLE_SEARCH_CONSOLE_SITE_URL
        value: https://www.societyflats.com
      - key: GOOGLE_SEARCH_CONSOLE_ACCESS_TOKEN
        sync: false
      - key: GOOGLE_SEARCH_CONSOLE_CLIENT_ID
        sync: false
      - key: GOOGLE_SEARCH_CONSOLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_SEARCH_CONSOLE_REFRESH_TOKEN
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: societyflats-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: societyflats-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: societyflats-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: societyflats-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: societyflats-db
          property: password

databases:
  - name: societyflats-db
    databaseName: societyflats
    user: societyflats
    plan: free
    ipAllowList: []
